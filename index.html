
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surat Kecil buat kamu 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card" id="cover">
      <div class="bear">🧸</div>
      <h1>Hi Naa</h1>
      <p>Aku punya sesuatu buat kamu...</p>
      <button id="open">Buka Surat 💌</button>
      <audio id="bgMusic" src="love.mp3" loop></audio>
    </section>

    <section class="card hidden" id="letterCard">
      <div class="progress">
        <span id="percent">10%</span>
        <div class="track">
          <div class="fill" id="fill"></div>
        </div>
      </div>

      <div class="bear">💗</div>
      <div id="letter"></div>
      <button id="next">Next ♥</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
